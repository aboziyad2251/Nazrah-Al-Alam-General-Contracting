## Nazrah Al Alam — CI / CD Pipeline
## Single image build (nazrah-all) → deploy to VPS

name: CI / Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY:     ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:

  # ── Quality (informational, non-blocking) ─────────────────────────────────────
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.0.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck || true
      - run: pnpm run lint     || true

  # ── Build single image ────────────────────────────────────────────────────────
  build:
    name: Build & push nazrah-all
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    outputs:
      sha_short: ${{ steps.sha.outputs.short }}
      app_tag:   ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/nazrah-all
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push nazrah-all
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.all
          push: true
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SITE_URL=https://nazrah-main.algarni.online
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_APP_VERSION=${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
          platforms:  linux/amd64

  # ── Deploy to VPS ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync compose + config files to VPS
        run: |
          rsync -avz --checksum \
            docker-compose.yml \
            traefik/ \
            nginx/ \
            supervisord.conf \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/nazrah/

      - name: Pull new image & restart
        env:
          SHA: ${{ needs.build.outputs.sha_short }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash -s << 'ENDSSH'
            set -euo pipefail
            cd /opt/nazrah

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "${{ github.actor }}" --password-stdin

            APP_TAG="sha-$SHA" docker compose pull nazrah-all

            APP_TAG="sha-$SHA" docker compose up -d \
              --remove-orphans --no-deps nazrah-all

            sleep 15
            docker compose ps --format "table {{.Name}}\t{{.Status}}"
          ENDSSH

      - name: Notify Slack on success
        if: success() && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d '{"text":"✅ *Nazrah Al Alam* `sha-${{ needs.build.outputs.sha_short }}` deployed","attachments":[{"color":"good","fields":[{"title":"Actor","value":"${{ github.actor }}","short":true}]}]}'

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d '{"text":"🚨 *Nazrah Al Alam* deploy FAILED — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>","attachments":[{"color":"danger"}]}'
