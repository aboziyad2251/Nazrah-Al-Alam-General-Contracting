## Nazrah Al Alam — CI / CD Pipeline
##
## Triggers: push to master
## Jobs:    quality (non-blocking) | build → deploy
##
## Required GitHub Secrets (Settings → Secrets → Actions):
##   GHCR_TOKEN                  — GitHub PAT: packages:write, contents:read
##   SSH_PRIVATE_KEY             — Ed25519 private key for VPS deploy user
##   SSH_HOST                    — VPS IP or hostname
##   SSH_USER                    — VPS username (e.g. deploy)
##   NEXT_PUBLIC_SUPABASE_URL
##   NEXT_PUBLIC_SUPABASE_ANON_KEY
##   VITE_SUPABASE_URL
##   VITE_SUPABASE_ANON_KEY
##   SLACK_WEBHOOK_URL           — optional

name: CI / Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY:     ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:

  # ── Quality: lint + typecheck (informational — does not block deploy) ─────────
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck || true

      - name: Lint
        run: pnpm run lint || true

  # ── Build & push Docker images ────────────────────────────────────────────────
  build:
    name: Build & push images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    permissions:
      contents: read
      packages: write

    outputs:
      sha_short:   ${{ steps.sha.outputs.short }}
      web_tag:     ${{ steps.meta-web.outputs.version }}
      portal_tag:  ${{ steps.meta-portal.outputs.version }}
      admin_tag:   ${{ steps.meta-admin.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      # ── Metadata ────────────────────────────────────────────────────────────
      - name: Docker metadata (web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/nazrah-web
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Docker metadata (portal)
        id: meta-portal
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/nazrah-portal
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Docker metadata (admin)
        id: meta-admin
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/nazrah-admin
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # ── Builds (run in parallel via separate steps, each cached) ────────────
      - name: Build & push nazrah-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha,scope=web
          cache-to:   type=gha,scope=web,mode=max
          platforms:  linux/amd64

      - name: Build & push nazrah-portal
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.portal
          push: true
          tags: ${{ steps.meta-portal.outputs.tags }}
          labels: ${{ steps.meta-portal.outputs.labels }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_APP_VERSION=${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=portal
          cache-to:   type=gha,scope=portal,mode=max
          platforms:  linux/amd64

      - name: Build & push nazrah-admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.admin
          push: true
          tags: ${{ steps.meta-admin.outputs.tags }}
          labels: ${{ steps.meta-admin.outputs.labels }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_APP_VERSION=${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=admin
          cache-to:   type=gha,scope=admin,mode=max
          platforms:  linux/amd64

  # ── Deploy to VPS ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add VPS to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync compose files to VPS
        run: |
          rsync -avz --checksum \
            docker-compose.yml \
            traefik/ \
            nginx/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/nazrah/

      - name: Pull & restart services
        env:
          SHA:        ${{ needs.build.outputs.sha_short }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash -s << 'ENDSSH'
            set -euo pipefail
            cd /opt/nazrah

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              -u "${{ github.actor }}" --password-stdin

            WEB_TAG="sha-$SHA" PORTAL_TAG="sha-$SHA" ADMIN_TAG="sha-$SHA" \
              docker compose pull nazrah-web nazrah-portal nazrah-admin

            WEB_TAG="sha-$SHA" PORTAL_TAG="sha-$SHA" ADMIN_TAG="sha-$SHA" \
              docker compose up -d --remove-orphans --no-deps \
              nazrah-web nazrah-portal nazrah-admin

            sleep 15
            docker compose ps --format "table {{.Name}}\t{{.Status}}"
          ENDSSH

      - name: Notify Slack on success
        if: success() && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "✅ *Nazrah Al Alam* deployed `sha-${{ needs.build.outputs.sha_short }}`",
              "attachments": [{"color": "good", "fields": [
                {"title": "Actor", "value": "${{ github.actor }}", "short": true},
                {"title": "Commit", "value": "${{ github.sha }}", "short": true}
              ]}]
            }'

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d '{"text": "🚨 *Nazrah Al Alam* deploy FAILED — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>", "attachments": [{"color": "danger"}]}'
