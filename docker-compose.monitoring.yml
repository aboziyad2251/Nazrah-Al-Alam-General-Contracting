## Optional monitoring stack — Loki + Promtail + Grafana
## Deploy with: docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
## Grafana UI available at http://localhost:3001 (SSH tunnel) or behind Traefik

services:

  loki:
    image: grafana/loki:3.2.0
    container_name: loki
    restart: unless-stopped
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/config.yml
    networks:
      - monitoring
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  promtail:
    image: grafana/promtail:3.2.0
    container_name: promtail
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - monitoring
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL:              https://grafana.nazrahalalam.com
      GF_SECURITY_ADMIN_USER:          ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD:      ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_DISABLE_GRAVATAR:    "true"
      GF_ANALYTICS_REPORTING_ENABLED:  "false"
      GF_USERS_ALLOW_SIGN_UP:          "false"
      GF_AUTH_ANONYMOUS_ENABLED:       "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=nazrahalalam_proxy"
      - "traefik.http.routers.grafana.rule=Host(`grafana.nazrahalalam.com`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.routers.grafana.middlewares=security-headers@file"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

networks:
  monitoring:
    driver: bridge
  proxy:
    external: true
    name: nazrahalalam_proxy

volumes:
  loki-data:
  grafana-data:
