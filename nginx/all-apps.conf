# nginx virtual host config — all three Nazrah apps in one container
# Supervisord runs both nginx and Next.js; nginx proxies web host → Node :3000

# ── nazrah-main.algarni.online → Next.js ──────────────────────────────────────
server {
    listen 80;
    server_name nazrah-main.algarni.online;

    # Health check endpoint (used by Traefik + Docker healthcheck)
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Static assets baked into the Next.js standalone build
    location /_next/static/ {
        alias /app/apps/web/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /public/ {
        alias /app/apps/web/public/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Everything else → Next.js server on :3000
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }
}

# ── nazrah-client.algarni.online → Portal SPA ─────────────────────────────────
server {
    listen 80;
    server_name nazrah-client.algarni.online;

    root /var/www/portal;
    index index.html;

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── nazrah-app.algarni.online → Admin SPA ────────────────────────────────────
server {
    listen 80;
    server_name nazrah-app.algarni.online;

    root /var/www/admin;
    index index.html;

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ── default: catch-all health (used when no Host matches — e.g. Traefik probe) ─
server {
    listen 80 default_server;
    server_name _;

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 444;
    }
}
