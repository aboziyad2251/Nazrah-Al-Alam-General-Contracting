# ── Default: health check + redirect to main site ────────────────────────────
server {
    listen 80 default_server;
    server_name _;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location / {
        return 301 https://nazrah-main.algarni.online$request_uri;
    }
}

# ── nazrah-main.algarni.online → Next.js (Node.js :3000) ─────────────────────
server {
    listen 80;
    server_name nazrah-main.algarni.online;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:3000/api/health;
    }

    # Next.js static assets — long-lived cache (hashed filenames)
    location /_next/static/ {
        alias /app/apps/web/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Public files
    location /public/ {
        alias /app/apps/web/public/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Everything else → Next.js
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header   X-Forwarded-Port  $http_x_forwarded_port;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# ── nazrah-client.algarni.online → Client Portal (static) ────────────────────
server {
    listen 80;
    server_name nazrah-client.algarni.online;
    root  /var/www/portal;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|webp|avif|svg|gif)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options           "SAMEORIGIN"                      always;
        add_header X-Content-Type-Options    "nosniff"                         always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    }

    location ~ /\. { deny all; }
}

