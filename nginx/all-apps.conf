server {
    listen 80;
    server_name nazrah-mainx.algarni.online;

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /_next/static/ {
        alias /app/apps/web/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_set_header   X-Forwarded-Port 443;
        proxy_read_timeout 60s;
        proxy_buffering    off;
        proxy_redirect     http://localhost:3000/ https://nazrah-mainx.algarni.online/;
    }
}

server {
    listen 80;
    server_name nazrah-client.algarni.online;
    root /var/www/portal;
    index index.html;
    location /health { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y; add_header Cache-Control "public, immutable"; access_log off; try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    server_name nazrah-app.algarni.online;
    root /var/www/admin;
    index index.html;
    location /health { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y; add_header Cache-Control "public, immutable"; access_log off; try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80 default_server;
    server_name _;
    location /health { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
    location / { return 444; }
}
