server {
    listen      8080;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Minimal access log — full logs go to stdout for Docker/Loki
    access_log /var/log/nginx/access.log combined;
    error_log  /var/log/nginx/error.log warn;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml font/woff2;

    # ── Health endpoint (used by Docker + Traefik) ────────────────────────────
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ── Immutable hashed assets (Vite bundles hash filenames) ─────────────────
    location ~* \.(js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|webp|avif|svg|gif)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── SPA fallback: all routes → index.html ─────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;

        # Security headers (belt-and-suspenders alongside Traefik middleware)
        add_header X-Frame-Options           "SAMEORIGIN"                    always;
        add_header X-Content-Type-Options    "nosniff"                       always;
        add_header X-XSS-Protection          "1; mode=block"                 always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    }

    # ── Block hidden files ─────────────────────────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
