## Nazrah Al Alam — Production Docker Compose
## Single app container (nginx + Next.js via supervisord) + Traefik + Postgres + Redis
## VPS: 76.13.40.119 | Domain: algarni.online

services:

  # ── Traefik: reverse proxy + TLS ─────────────────────────────────────────────
  traefik:
    image: traefik:v3.2
    container_name: traefik
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - ./traefik/dynamic.yml:/dynamic.yml:ro
      - ./traefik/auth:/auth:ro
      - traefik-certs:/etc/traefik/acme
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.algarni.online`)"
      - "traefik.http.routers.traefik-dashboard.entrypoints=websecure"
      - "traefik.http.routers.traefik-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.middlewares=dashboard-auth@file"

  # ── All apps — single container (nginx + Node.js via supervisord) ─────────────
  # nginx routes internally:
  #   nazrah-main.algarni.online   → Node.js :3000 (Next.js)
  #   nazrah-client.algarni.online → /var/www/portal  (static)
  #   nazrah-app.algarni.online    → /var/www/admin   (static)
  nazrah-all:
    image: ghcr.io/${GHCR_REPO}/nazrah-all:${APP_TAG:-latest}
    container_name: nazrah-all
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    networks:
      - proxy
    depends_on:
      traefik:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=nazrahalalam_proxy"
      - "traefik.http.routers.web.rule=Host(`${WEB_HOST:-nazrah-main.algarni.online}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.web.middlewares=compress@file,security-headers@file,rate-limit@file"
      - "traefik.http.routers.web.service=nazrah-all"
      - "traefik.http.routers.portal.rule=Host(`${PORTAL_HOST:-nazrah-client.algarni.online}`)"
      - "traefik.http.routers.portal.entrypoints=websecure"
      - "traefik.http.routers.portal.tls.certresolver=letsencrypt"
      - "traefik.http.routers.portal.middlewares=compress@file,security-headers@file,rate-limit@file"
      - "traefik.http.routers.portal.service=nazrah-all"
      - "traefik.http.routers.admin.rule=Host(`${ADMIN_HOST:-nazrah-app.algarni.online}`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.admin.middlewares=compress@file,security-headers@file,rate-limit-auth@file"
      - "traefik.http.routers.admin.service=nazrah-all"
      - "traefik.http.services.nazrah-all.loadbalancer.server.port=80"
      - "traefik.http.services.nazrah-all.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.nazrah-all.loadbalancer.healthcheck.interval=30s"

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: nazrah-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-nazrah}
      POSTGRES_USER:     ${POSTGRES_USER:-nazrah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nazrah} -d ${POSTGRES_DB:-nazrah}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nazrah-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --loglevel notice
    volumes:
      - redis-data:/data
    networks:
      - backend
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Watchtower: auto-pull on new image push ───────────────────────────────────
  watchtower:
    image: containrrr/watchtower:1.7.1
    container_name: nazrah-watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP:                       "true"
      WATCHTOWER_POLL_INTERVAL:                 300
      WATCHTOWER_ROLLING_RESTART:               "true"
      WATCHTOWER_NOTIFICATIONS:                 slack
      WATCHTOWER_NOTIFICATION_SLACK_HOOK_URL:   ${SLACK_WEBHOOK_URL:-}
      WATCHTOWER_NOTIFICATION_SLACK_IDENTIFIER: "watchtower-nazrah"
      WATCHTOWER_NOTIFICATION_SLACK_CHANNEL:    "#deployments"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro
    command: nazrah-all --interval 300

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  proxy:
    driver: bridge
  backend:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  traefik-certs:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
